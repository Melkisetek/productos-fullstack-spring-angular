spring.application.name=gestion-db-api
# Conexion mariaDB
spring.datasource.url = jdbc:mariadb://localhost:3306/gestion_db_api?useSSL=false&serverTimezone=UTC
spring.datasource.username = root
spring.datasource.password =
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Desactivar tomcat
#spring.main.web-application-type=none
# Hibernate: Crea las tablas autom\u00e1ticamente basado en tus clases Java
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola los comandos SQL que Spring ejecuta internamente.
spring.show-sql=true

# Habilitar el reinicio autom\u00e1tico de DevTools (activado por defecto)
spring.devtools.restart.enabled=true